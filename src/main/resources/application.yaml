# VERY SIMPLE configuration
spring:
  application:
    name: customer-management-api
  
  datasource:
    url: jdbc:h2:mem:customerdb
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  
  jpa:
    hibernate:
      ddl-auto: create
    show-sql: true
  
  h2:
    console:
      enabled: true